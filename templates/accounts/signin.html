{% extends 'base.html' %}

{% block title %}
<title>Sign In</title>
{% endblock %}

{% block content %}
<style>
  body {
    background: url('https://images.unsplash.com/photo-1533158326339-7f3cf2404354?q=80&w=2854&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 40px;
    color: #fff;
    transition: all 0.3s ease-in-out;
  }

  .glass-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
  }

  .form-control {
    background-color: rgba(255, 255, 255, 0.9);
    border: none;
    border-radius: 10px;
  }

  .form-control:focus {
    box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.5);
    outline: none;
  }

  .btn-custom {
    border-radius: 50px;
    font-weight: bold;
    padding: 10px 30px;
    transition: 0.3s;
  }

  .btn-custom:hover {
    transform: scale(1.05);
  }

  .container-center {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  h3, label {
    color: #fff;
  }

  .alert {
    background-color: rgba(255, 255, 255, 0.85);
    color: #333;
  }
</style>

<div class="container-center">
  <form method="post" class="glass-card w-100" style="max-width: 450px;">
    {% csrf_token %}
    <h3 class="text-center mb-4">Sign In to Craffitti</h3>
    {% if messages %}
      {% for message in messages %}
        <p class="alert alert-{{ message.tags }}">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <div class="mb-3">
      <label for="nm" class="form-label">Username</label>
      <input class="form-control" placeholder="Enter your email here" name="nm" id="nm" type="text" required>
    </div>

    <div class="mb-4">
      <label for="pw" class="form-label">Password</label>
      <input class="form-control" placeholder="Enter your password" name="pw" id="pw" type="password" required>
    </div>

    <div class="text-center">
      <button class="btn btn-outline-light btn-custom me-2" type="submit">SUBMIT</button>
      <button type="reset" class="btn btn-outline-success btn-custom">RESET</button>
    </div>
  </form>
</div>

{% endblock %}
