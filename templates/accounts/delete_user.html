{% extends 'base.html' %}



{% block title %}
<title>Delete User</title>
{% endblock %}


{% block content %}
<div class="container mt-4 text-center">
<h5>Do you really want to delete your profile?</h5>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'user_url' %}"><button type="submit" class="btn btn-outline-danger text-dark col-6">YES</button></a><br><br>
    
        <a href="{% url 'home' %}"><button type="button" class="btn btn-outline-warning text-dark col-6">NO</button></a>
    </form>
</div>

{% endblock %}
