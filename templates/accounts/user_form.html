{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    <title>User Registration</title>
{% endblock %}

{% block content %}

<form method="post" class="form-control w-50 mx-auto">
    {% csrf_token %}
    {{form|crispy}}

    <br><br>
    <div class="text-center">
    <input class="btn btn-success col-4 me-3" type="submit">
    <input class="btn btn-warning col-4" type="reset">
    </div>

</form>
