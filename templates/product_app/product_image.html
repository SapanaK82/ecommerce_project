{% extends 'base.html' %}
{% load crispy_forms_tags %}


{% block title %}
<title>Product Image</title>
{% endblock %}



{% block content %}
<form method="post" class="container w-50 mt-4 mb-4" enctype="multipart/form-data">
    {% csrf_token %}
    {{form|crispy}}
    <div class="text-center">
        <input type="submit" class="btn btn-outline-success me-4 col-5">
        <input type="reset" class="btn btn-outline-warning col-5">
    </div>
</form>
{% endblock %}
