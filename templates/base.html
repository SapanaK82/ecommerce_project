<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% block title %}
    <title>Title</title>
    {% endblock %}
    <link rel="stylesheet" href="{% static 'bootstrap-5.0.2-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="{% static 'bootstrap-5.0.2-dist/js/bootstrap.min.js' %}"></script>
</head>
<body>
  <div class="d-flex">
    <div  style="padding-left:800px;" class="col me-4 mt-4">
    <form>
        <input type="text" name="search" class="form-control w-100" placeholder="Search art or artist">
    </form>
    </div>
    <div class="col mt-4">
    <i class="bi bi-cart4 fs-3 me-4"></i>
    <i class="bi bi-bookmark-heart fs-3"></i>
    </div>
  </div>
</div>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        
        <div class="container-fluid">
            <div class="text-center me-4">
                <img src="{% static 'logo/logo.png/' %}" height="80px"><br>
                <!--<a class="navbar-brand" href="#">Craffitti</a>-->
            </div>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link active text-black fs-6" aria-current="page" href="{% url 'home' %}">Home</a>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle active text-black fs-6" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-current="page">
                  Category
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item mb-2" href="#">Painting</a></li>
                  <li><a class="dropdown-item mb-2" href="#">Drawing</a></li>
                  <li><a class="dropdown-item mb-2" href="#">Sculpture</a></li>
                  <li><a class="dropdown-item mb-2" href="#">Photography</a></li>
                  <li><a class="dropdown-item mb-2" href="#">Print</a></li>
                </ul>
              </li>
              <a class="nav-link active text-black fs-6" href="{% url 'show_artist' %}">Artist</a>
              <a class="nav-link active text-black fs-6" href="#">Contact Us</a>
              {% if user.is_authenticated %}
              <a class="nav-link active text-black fs-6" href="#" style="padding-left: 400px;">Log Out</a>
              {% endif %}
              <a class="nav-link active text-black fs-6" href="#" style="padding-left:800px;">Sign In</a>
              <a class="nav-link active text-black fs-6" href="{% url 'user_url' %}">Sign Up</a>
            </div>
          </div>
        </div>
      </nav>
{% block content %}
{% endblock %}

</body>
</html>
